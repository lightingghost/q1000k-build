name: fastbuild Q1000K XGS-PON
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character commit on openwrt-q1000k/q1000k-xgspon (blank builds the latest)
        required: false
        type: string
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
  packages: write
  actions: write
concurrency:
  group: q1000k-xgspon-build
  cancel-in-progress: false
jobs:
  select-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.select.outputs.revision }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - id: select
        name: Select source revision and skip unchanged scheduled builds
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.source_commit || '' }}
        run: |
          set -euo pipefail
          tip=$(git ls-remote https://github.com/lightingghost/openwrt-q1000k.git refs/heads/q1000k-xgspon | cut -f1)
          [[ $tip =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Cannot resolve q1000k-xgspon'; exit 1; }
          if [[ -n $REQUESTED_COMMIT ]]; then
            [[ $REQUESTED_COMMIT =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Enter a full 40-character lowercase commit'; exit 1; }
            revision=$REQUESTED_COMMIT
          else
            revision=$tip
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            short=${revision:0:12}
            tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
            if grep -Eq "^q1000k-xgspon_${short}_" <<< "$tags"; then
              echo "Already released source revision $revision; skipping scheduled build."
              echo 'build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"

  build:
    needs: select-source
    if: needs.select-source.outputs.build == 'true'
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    strategy: {fail-fast: false, matrix: {target: [q1000k-xgspon]}}
    env:
      DK_OPENWRT: /bld/openwrt
      DK_BIN: /bld/openwrt_bin
      DK_USER: /bld/user
      DK_PROFILE: /bld/user/current
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.select-source.outputs.revision }}
      IMG_BASE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:base-builder
      IMG_INC: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ matrix.target }}-inc
      # Used only until this repository has produced its first base image.
      IMG_BOOTSTRAP: ghcr.io/w1700k/fastbuild_base:base-builder
    steps:
    - uses: actions/checkout@v7

    - uses: docker/login-action@v4
      with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}

    - id: gh
      uses: actions/cache/restore@v5
      # Do not reuse staging output made by the earlier failed bootstrap runs.
      with: {path: "ghcache\nstcache", key: 'cache-v2-${{ matrix.target }}.${{ github.run_id }}', restore-keys: 'cache-v2-${{ matrix.target }}.'}
    - id: dl
      uses: actions/cache/restore@v5
      with: {path: dlcache, key: 'dlcache.${{ github.run_id }}', restore-keys: dlcache.}

    - name: Seed caches if missing
      run: |
        mkdir -p openwrt_bin ghcache stcache dlcache
        if [ -z "$(ls -A ghcache 2>&-)" ] || [ -z "$(ls -A stcache 2>&-)" ]; then
          I=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:base-bldcache-${{ matrix.target }}
          if docker pull "$I" 2>&-; then
            docker create --name CA "$I" >/dev/null
            for d in ghcache stcache dlcache; do docker cp "CA:/$d/." "$d"; done
          else
            echo "No build cache image found; continuing with empty caches."
          fi
        fi

    - name: Initialize environment
      run: |
        [ -f user/q1000k/config.diff ] && [ -f user/q1000k-xgspon/config.diff ] && [ -f user/q1000k-xgspon/settings.ini ] || {
          echo '::error::Missing XGS-PON build profile'; exit 1;
        }
        rsync -aI --mkpath user/q1000k/ user/current/ 2>&-
        printf '\n' >> user/current/config.diff
        cat user/q1000k-xgspon/config.diff >> user/current/config.diff
        cp user/q1000k-xgspon/settings.ini user/current/settings.ini
        cp user/current/config.diff user/current/required.config
        echo 'CONFIG_CCACHE_DIR="/ghcache"' >> user/current/config.diff
        sudo tee /etc/docker/daemon.json <<< '{"max-concurrent-downloads":50,"max-concurrent-uploads":50,"experimental":true}'
        sudo systemctl reload docker
        IMAGE=$IMG_INC
        if ! docker pull "$IMAGE" 2>&-; then
          IMAGE=$IMG_BASE
          if ! docker pull "$IMAGE" 2>&-; then
            IMAGE=$IMG_BOOTSTRAP
            docker pull "$IMAGE"
          fi
        fi
        docker run -dt --name DK -v $PWD/user:$DK_USER -v $PWD/openwrt_bin:$DK_BIN -v $PWD/ghcache:/ghcache -v $PWD/stcache:/stcache -v $PWD/dlcache:/dlcache $IMAGE
        install -m 755 /dev/stdin /usr/local/bin/docker_exec <<'DKR'
        #!/bin/bash
        for n in DK_BIN DK_USER DK_PROFILE DK_OPENWRT SOURCE_COMMIT; do e+=(-e "$n=${!n}"); done
        exec docker exec -u 0 -i "${e[@]}" "$@"
        DKR

    - name: Prepare OpenWrt source
      run: |
        docker_exec DK bash -e -c '
          . $DK_USER/default/settings.ini &>/dev/null ||:
          . $DK_PROFILE/settings.ini
          [[ $REPO_URL && $REPO_BRANCH ]] || { echo "::error::Missing REPO_URL or REPO_BRANCH"; exit 1; }
          mkdir -p $DK_OPENWRT/files
          cd $DK_OPENWRT
          if [ ! -d .git ]; then git init; fi
          git remote set-url origin $REPO_URL 2>&- || git remote add origin $REPO_URL
          git fetch
          if [[ -n $SOURCE_COMMIT ]]; then
            git merge-base --is-ancestor "$SOURCE_COMMIT" "origin/$REPO_BRANCH" || {
              echo "::error::Dispatched commit is not on $REPO_BRANCH"; exit 1;
            }
            git checkout --detach "$SOURCE_COMMIT"
          else
            git checkout "$REPO_BRANCH" && git pull --ff-only
          fi
          { git log -1 --oneline HEAD; git log origin/main..HEAD --oneline ||:; } > files/build_info
          mountpoint $DK_BIN || { echo "::error::not mounted" >&2; exit 1; }
          cp files/build_info $DK_BIN
          rm -rf bin dl staging_dir
          ln -s $DK_BIN bin && ln -s /dlcache dl && ln -s /stcache staging_dir
          bp=$DK_PROFILE fc=feeds.conf
          cp $bp/files/$fc $fc 2>&- && cp $fc /tmp/feeds.bak
          rm -rf feeds/* &>/dev/null; ./scripts/feeds update -a &>/dev/null; ./scripts/feeds install -a
          mv /tmp/feeds.bak $fc &>/dev/null ||:
          cp $bp/config.diff .config
          cat $bp/patches/*.patch 2>&- | patch -d . -p0 --forward ||:
          cp -r $bp/files/ . &>/dev/null ||:
          bash $bp/custom.sh &>/dev/null ||:
          make defconfig
          while IFS= read -r required; do
            if [[ $required == CONFIG_*=* || $required == \#\ CONFIG_*\ is\ not\ set ]]; then
              grep -Fxq "$required" .config || { echo "::error::Kconfig dropped $required"; exit 1; }
            fi
          done < "$bp/required.config"
          echo "CONFIG_VERSION_NUMBER=${{ matrix.target }}" >> .config
          make download -j8 2>&1 | tee /dev/stderr | grep -q "ERROR:" || [ $PIPESTATUS -ne 0 ] && exit 1 ||:
        '

    - name: Compile OpenWrt
      run: |
        status=1
        for mode in c s; do
          if docker_exec -e MODE="$mode" DK bash -e -c '
            bash $DK_PROFILE/pre_compile.sh 2>&- ||:
            cd $DK_OPENWRT
            export FORCE_UNSAFE_CONFIGURE=1 CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,time_macros CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content
            make -j$(($(nproc) + 1)) V="$MODE"
            [ ! -x staging_dir/host/bin/ccache ] || staging_dir/host/bin/ccache -d /ghcache -sz ||:
          '; then
            status=0
            break
          fi
          echo "::warning::OpenWrt compilation attempt V=$mode failed."
        done
        exit "$status"

    - name: Create release
      run: |
        sudo chown -R "$(id -u):$(id -g)" openwrt_bin stcache
        find -L openwrt_bin/targets/*/* -maxdepth 1 -type f -exec install -D -t firmware {} +
        SOURCE_REV=$(awk 'NR == 1 { print substr($1, 1, 12) }' openwrt_bin/build_info)
        [ -n "$SOURCE_REV" ] || { echo "::error::Missing OpenWrt source revision"; exit 1; }
        VERSION="${{ matrix.target }}_${SOURCE_REV}_$(date +'%Y%m%d')_${{ github.run_id }}"
        sed -i "s/^/    /; 1s/^/## $VERSION\n\n/" openwrt_bin/build_info
        shopt -s nullglob
        artifacts=(firmware/*-quantum_q1000k-ubi-initramfs-recovery.itb firmware/*-quantum_q1000k-ubi-squashfs-sysupgrade.itb)
        [ "${#artifacts[@]}" -eq 2 ] || { echo "::error::Expected Q1000K initramfs and sysupgrade images"; printf '%s\\n' firmware/*; exit 1; }
        gh release create "$VERSION" "${artifacts[@]}" --prerelease --title "Experimental XGS-PON $VERSION" --notes-file openwrt_bin/build_info

    - name: Upload builder container
      run: |
        docker_exec DK bash -c 'cd $DK_OPENWRT && rm -rf bin build_dir feeds tmp'
        docker commit -a openwrt-fastbuild -m "Building at $(date)" DK $IMG_INC
        docker push $IMG_INC

    - name: Delete old caches
      if: success()
      run: |
        for p in dlcache. cache-v2-${{ matrix.target }}.; do
          gh cache list --json key,id --jq '.[] | select(.key | startswith("'"$p"'")) | .id' | xargs -r gh cache delete
        done ||:

    - uses: actions/cache/save@v5
      if: success()
      with: {path: "ghcache\nstcache", key: '${{ steps.gh.outputs.cache-primary-key }}'}
    - uses: actions/cache/save@v5
      if: success()
      with: {path: dlcache, key: '${{ steps.dl.outputs.cache-primary-key }}'}
